name: Publiceren op GitHub Pages

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eén publicatie tegelijk; een lopende deploy niet afbreken.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      # Let op: GitHub Pages moet eenmalig aanstaan in de repo-instellingen:
      # Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
      # De token van Actions mag dat zelf niet aanzetten.
      - name: Pages klaarzetten
        uses: actions/configure-pages@v5

      - name: Site inpakken
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publiceren
        id: deployment
        uses: actions/deploy-pages@v4
